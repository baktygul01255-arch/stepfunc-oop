<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мастер арок · Уровень А</title>
<style>
:root{--bg:#f3f7fb;--card:#fff;--ink:#1f2d3d;--blue:#2d6cdf;--green:#2e9e5b;--orange:#f08a24;--soft:#e6eefb}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:22px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 10px #0001;margin-bottom:16px}
h1{font-size:34px;margin:6px 0}h2{font-size:28px;margin:4px 0 12px}
button{font:inherit;border:none;border-radius:16px;padding:16px 22px;margin:6px;cursor:pointer;background:var(--blue);color:#fff;min-width:140px;min-height:64px}
button:hover{filter:brightness(1.08)}button:focus{outline:4px solid #ffd54a}
button.alt{background:#fff;color:var(--ink);border:3px solid var(--blue)}
button.big{font-size:30px;min-width:220px;min-height:110px}
button.ok{background:var(--green)}button.soft{background:var(--soft);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.msg{min-height:56px;font-size:26px;text-align:center;margin:10px 0;font-weight:600}
.good{color:var(--green)}.try{color:var(--orange)}
.stars{font-size:32px;text-align:center;letter-spacing:4px}
.emoji{font-size:90px;text-align:center;line-height:1.1}
.prog{height:16px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
table{border-collapse:collapse;width:100%;font-size:19px}td,th{border:2px solid #cbd7ea;padding:8px;text-align:center}
input[type=text],input[type=number]{font:inherit;padding:12px;border:3px solid var(--blue);border-radius:12px;width:180px;text-align:center}
.small{font-size:17px;color:#51627a}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
#balloon{font-size:130px;transition:transform .25s;display:inline-block}
.hint{background:#fff8e1;border-radius:12px;padding:10px;font-size:20px}
@media print{.top,button,.small,#rep ~ *{display:none!important}body{background:#fff;font-size:16px}.card{box-shadow:none}.card:not(#rep){display:none}input,select{border:none!important}}</style></head><body><div class="wrap">
<div class="top"><h1>🌉 Мастер арок · А</h1><div><button class="soft" onclick="home()">🏠 Меню</button><button class="soft" id="vc" onclick="toggleVoice()">🗣️ Озвучка вкл.</button><button class="soft" onclick="glossary()">📖 Словарик</button><button class="soft" id="snd" onclick="toggleSound()">🔇 Звуки выкл.</button></div></div>
<div id="app"></div>
<p class="small">Тут нельзя проиграть. Кнопка «🔊 Прочитать» читает текст вслух; озвучку можно выключить вверху. Ошибся — попробуй ещё раз. Подсказка всегда рядом.</p>
</div>
<script>
const $=id=>document.getElementById(id);const app=$('app');
let sound=false,stars=0,AC;
function beep(f,d=0.15){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=0.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function toggleSound(){sound=!sound;$('snd').textContent=sound?'🔊 Звуки вкл.':'🔇 Звуки выкл.';beep(660)}
const praise=['Молодец!','Отлично!','Правильно!','Супер!','Здорово!'];
const rp=()=>praise[Math.floor(Math.random()*praise.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function starsHTML(){return '⭐'.repeat(stars)||'☆'}

let voice=true;
function say(t){if(!voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,' ').replace(/[₁₂]/g,m=>m=='₁'?' один':' два').replace(/\*/g,' умножить на ').replace(/=/g,' равно '));u.lang='ru-RU';u.rate=0.85;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith('ru'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function sayNow(t){const o=voice;voice=true;say(t);voice=o}
function toggleVoice(){voice=!voice;$('vc').textContent=voice?'🗣️ Озвучка вкл.':'🗣️ Озвучка выкл.';if(voice)say('Озвучка включена');else if('speechSynthesis' in window)speechSynthesis.cancel()}
function rb(t){return `<button class="soft" onclick="sayNow(this.dataset.t)" data-t="${t.replace(/"/g,'&quot;').replace(/<[^>]+>/g,' ')}">🔊 Прочитать</button>`}
let lessonKey,lessonI,lessonNext;
function lesson(k,next){lessonKey=k;lessonI=0;lessonNext=next;showLesson()}
function showLesson(){const L=LESSONS[lessonKey],x=L[lessonI];
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${(lessonI+1)/L.length*100}%"></i></div><div class="emoji">${x.e}</div><h2 style="text-align:center">${x.t}</h2><p style="text-align:center;font-size:26px">${x.x}</p>
<div class="row">${rb(x.t+'. '+x.x)}</div>
<div class="row">${lessonI>0?'<button class="alt" onclick="lessonI--;showLesson()">⬅ Назад</button>':''}
${lessonI<L.length-1?'<button class="ok" onclick="lessonI++;showLesson()">Дальше ➜</button>':'<button class="ok" onclick="'+lessonNext+'">🎮 Играть!</button>'}</div></div>`;say(x.t+'. '+x.x)}
function confetti(){const c=document.createElement('canvas');c.width=innerWidth;c.height=innerHeight;c.style.cssText='position:fixed;left:0;top:0;pointer-events:none;z-index:99';document.body.appendChild(c);const g=c.getContext('2d');const P=[];for(let i=0;i<70;i++)P.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:5+Math.random()*6,h:Math.random()*360,a:1});let f=0;(function t(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.a-=.012;g.globalAlpha=Math.max(p.a,0);g.fillStyle=`hsl(${p.h},85%,55%)`;g.fillRect(p.x,p.y,p.r,p.r)});if(++f<90)requestAnimationFrame(t);else c.remove()})()}

/* ===== ASSESSMENT ===== */
let RES=[],mis=0,hnt=0,curLevel='';
const LVL={low:'Низкий уровень',mid1:'Уровень ниже среднего',mid2:'Средний уровень'};
const PTS=[100,80,60,40,40];
function rec(name,m,h){const tutor=(m==='tutor');const pts=tutor?100:PTS[Math.min(4,(m||0)+(h||0))];RES=RES.filter(r=>r.name!==name);RES.push({name,pts,tutor,m:tutor?0:m,h:tutor?0:h})}
function grade(p){return p>=95?'A':p>=90?'A−':p>=85?'B+':p>=80?'B':p>=75?'B−':p>=70?'C+':p>=65?'C':p>=60?'C−':p>=55?'D+':p>=50?'D':'F'}
function avg(){return RES.length?Math.round(RES.reduce((s,r)=>s+r.pts,0)/RES.length):0}
function showResults(next){const a=avg(),zach=a>=50;
const msg=a>=80?'Ты справился отлично!':a>=50?'Хорошо получилось! Ты молодец!':'Ты старался! Давай попробуем ещё раз — получится лучше!';
app.innerHTML=`<div class="card"><div class="emoji">🏆</div><h2 style="text-align:center">${msg}</h2>
<p class="stars">${'⭐'.repeat(Math.max(1,Math.round(a/20)))}</p>
<p style="text-align:center;font-size:44px;margin:4px"><b>${a} баллов</b></p>
<p style="text-align:center;font-size:26px">Оценка: <b>${grade(a)}</b> · ${zach?'<span class="good">зачтено ✅</span>':'<span class="try">ещё потренируемся</span>'}</p>
<div class="row">${rb(msg+' У тебя '+a+' баллов.')}<button class="ok" onclick="${next}">Играть ещё</button><button class="alt" onclick="home()">В меню</button></div></div>
<div class="card" id="rep"><h2>📋 Лист оценивания (для педагога)</h2>
<div class="row"><label>ФИО: <input type="text" id="fio" style="width:260px"></label><label>Дата: <input type="text" id="dt" style="width:150px" value="${new Date().toLocaleDateString('ru-RU')}"></label></div>
<p><b>${LVL[curLevel]||''}</b> · Тема 10. Газовые законы</p>
<table id="rt"><tr><th>№</th><th>Задание</th><th>Ошибки / подсказки</th><th>Баллы</th></tr>
${RES.map((r,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${r.name}</td><td>${r.tutor?'оценивает педагог':r.m+' / '+r.h}</td><td>${r.tutor?`<select onchange="RES[${i}].pts=+this.value;updRes()" style="font-size:18px">${[100,80,60,40,0].map(v=>`<option ${v===r.pts?'selected':''}>${v}</option>`).join('')}</select>`:r.pts}</td></tr>`).join('')}
<tr><th colspan="3" style="text-align:right">Средний балл</th><th id="tot">${a}</th></tr></table>
<p id="gr2" style="font-size:22px"><b>Оценка: ${grade(a)} · ${zach?'зачтено':'не зачтено'}</b></p>
<p class="small">Баллы за задание: без ошибок и подсказок — 100; одна ошибка или подсказка — 80; две — 60; три и больше — 40; не выполнено — 0. Задания-действия (опыты, лаборатория) оценивает педагог или тьютор по уровню помощи. Шкала: A 95–100, A− 90–94, B+ 85–89, B 80–84, B− 75–79, C+ 70–74, C 65–69, C− 60–64, D+ 55–59, D 50–54, F 0–49. Зачёт — от 50 баллов.</p>
<div class="row"><button class="soft" onclick="window.print()">🖨️ Печать / PDF</button></div></div>`;
say(msg+' У тебя '+a+' баллов.');confetti()}
function updRes(){const a=avg();$('tot').textContent=a;$('gr2').innerHTML='<b>Оценка: '+grade(a)+' · '+(a>=50?'зачтено':'не зачтено')+'</b>'}
function done(next){showResults(next)}


/* ===== ТЕМА 11: УРОВЕНЬ А ===== */
const END='Мост построен! Арки получились красивые. Ты настоящий мастер арок!';
const STORY=['Ты — мастер арок. В городе строят мост.','Арка моста — это парабола. Она как радуга, только вверх ногами.','Помоги построить мост! Играй и нажимай.','Начнём?'];
LVL.a='Уровень А (низкий)';
const LESSONS={a:[
{e:'🌉',t:'Арка',x:'Это мост с аркой. Арка круглая, как радуга.'},
{e:'🟦',t:'Квадрат',x:'Квадрат — это много клеточек. Два на два — четыре клеточки. Три на три — девять клеточек.'},
{e:'📈',t:'Парабола',x:'Арка моста — это парабола. Парабола — это красивая линия, как арка.'},
{e:'🪞',t:'Зеркало',x:'У арки две одинаковые половинки. Как в зеркале.'}]};
function glossary(){const all=[['Арка','круглая часть моста'],['Квадрат','фигура с равными сторонами'],['Парабола','линия, похожая на арку'],['Зеркало','две одинаковые половинки']];
app.innerHTML='<div class="card"><h2>📖 Словарик</h2><table>'+all.map(a=>`<tr><td style="font-size:26px"><b>${a[0]}</b></td><td style="font-size:22px">${a[1]}</td><td>${rb(a[0]+'. '+a[1])}</td></tr>`).join('')+'</table><div class="row"><button class="alt" onclick="home()">В меню</button></div></div>'}
function bridgeSVG(kind,col){return kind==='arch'?`<svg viewBox="0 0 300 160" width="100%"><rect x="0" y="120" width="300" height="40" fill="#bfe0ff"/><path d="M30 120 Q150 -20 270 120" fill="none" stroke="#8d6e63" stroke-width="16"/><rect x="0" y="116" width="300" height="10" fill="#555"/></svg>`:`<svg viewBox="0 0 300 160" width="100%"><rect x="0" y="120" width="300" height="40" fill="#bfe0ff"/><rect x="30" y="60" width="240" height="16" fill="#8d6e63"/><rect x="60" y="76" width="10" height="44" fill="#a1887f"/><rect x="230" y="76" width="10" height="44" fill="#a1887f"/><rect x="0" y="116" width="300" height="10" fill="#555"/></svg>`}
let ai=0,li2=0,mis2=0;
function startA(){RES=[];curLevel='a';mis=0;hnt=0;stepArch()}
function sayShow(t){say(t)}
/* 1. найди арку */
function stepArch(){mis=0;hnt=0;const flip=Math.random()<.5;const A=flip?'flat':'arch',B=flip?'arch':'flat';
app.innerHTML=`<div class="card"><h2 style="text-align:center">Найди арку! Нажми на неё</h2><div class="row">${rb('Найди арку. Нажми на неё.')}</div><div class="msg" id="m"></div>
<div class="row"><button class="alt" style="width:45%;min-height:150px" onclick="archPick('${A}')">${bridgeSVG(A)}</button><button class="alt" style="width:45%;min-height:150px" onclick="archPick('${B}')">${bridgeSVG(B)}</button></div></div>`;say('Найди арку. Нажми на неё.')}
function archPick(k){if(k==='arch'){rec('Найди арку',mis,hnt);$('m').innerHTML='<span class="good">'+rp()+' ⭐ Это арка!</span>';say('Правильно! Это арка.');confetti();beep(700);setTimeout(stepSquares,1400)}else{mis++;$('m').innerHTML='<span class="try">Попробуй ещё раз. Арка круглая, как радуга.</span>';say('Попробуй ещё раз. Арка круглая, как радуга.');beep(250)}}
/* 2. квадраты */
let sqN=2;
function stepSquares(){sqN=2;squares()}
function squares(){mis=0;hnt=0;const n=sqN,ans=n*n;let on=new Set();
app.innerHTML=`<div class="card"><h2 style="text-align:center">Раскрась все клеточки (${n} × ${n})</h2><div class="row">${rb('Раскрась все клеточки. Нажимай на клеточки.')}</div><div class="msg" id="m"></div>
<div id="grid" style="display:grid;grid-template-columns:repeat(${n},90px);gap:6px;justify-content:center;margin:12px 0"></div><div id="cnt" class="row"></div></div>`;
const G=$('grid');for(let i=0;i<n*n;i++){const c=document.createElement('div');c.style.cssText='width:90px;height:90px;border:4px solid #1f2d3d;background:#fff;cursor:pointer;border-radius:6px';c.onclick=()=>{if(on.has(i))return;on.add(i);c.style.background='#4aa3df';beep(300+on.size*80,.1);if(on.size===n*n)askCount()};G.appendChild(c)}
say('Раскрась все клеточки. Нажимай на клеточки.');
function askCount(){rec('Раскрасить квадрат '+n+'×'+n,'tutor');const opts=shuffle([ans-1,ans,ans+1]);$('m').innerHTML='Сколько клеточек? Нажми на число';say('Сколько клеточек? Нажми на число.');$('cnt').innerHTML=opts.map(v=>`<button class="big" onclick="sqPick(${v===ans},this)">${v}</button>`).join('')}
window.sqPick=(ok,b)=>{if(ok){rec('Сколько клеточек: '+n+'×'+n,mis,hnt);$('m').innerHTML='<span class="good">'+rp()+' ⭐ '+n+' на '+n+' — '+ans+'</span>';say('Правильно! '+n+' на '+n+' — '+ans);confetti();beep(700);setTimeout(()=>{if(sqN===2){sqN=3;squares()}else stepDots()},1600)}else{mis++;$('m').innerHTML='<span class="try">Посчитай вместе: раз, два, три…</span>';say('Посчитай клеточки ещё раз');b.style.opacity=.35;beep(250)}}}
/* 3. точки */
const DOTS=[[-2,4],[-1.5,2.25],[-1,1],[-.5,.25],[0,0],[.5,.25],[1,1],[1.5,2.25],[2,4]];
function stepDots(){mis=0;hnt=0;let k=0;const W=700,H=420,X=x=>350+x*130,Y=y=>370-y*80;
app.innerHTML=`<div class="card"><h2 style="text-align:center">Соедини точки по номерам</h2><div class="row">${rb('Соедини точки по номерам. Нажимай на точки: один, два, три.')}</div><div class="msg" id="m"></div><canvas id="cv" width="700" height="420" style="width:100%;border:3px solid var(--blue);border-radius:12px;background:#fff"></canvas><div class="row"><button class="soft" id="hb">💡 Подсказка</button></div></div>`;
const cv=$('cv'),g=cv.getContext('2d');let hl=-1;
function draw(){g.clearRect(0,0,W,H);g.strokeStyle='#e3ebf7';g.lineWidth=1;for(let i=0;i<=7;i++){g.beginPath();g.moveTo(i*100,0);g.lineTo(i*100,H);g.stroke()}g.strokeStyle='#1f2d3d';g.lineWidth=3;g.beginPath();g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.moveTo(X(0),0);g.lineTo(X(0),H);g.stroke();
if(k>1){g.strokeStyle='#2d6cdf';g.lineWidth=6;g.beginPath();DOTS.slice(0,k).forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.stroke()}
DOTS.forEach((p,i)=>{g.beginPath();g.arc(X(p[0]),Y(p[1]),i===hl?24:18,0,6.28);g.fillStyle=i<k?'#2e9e5b':(i===hl?'#f08a24':'#d22');g.fill();g.fillStyle='#fff';g.font='bold 22px sans-serif';g.textAlign='center';g.fillText(i+1,X(p[0]),Y(p[1])+8)})}
draw();say('Соедини точки по номерам. Нажимай на точки: один, два, три.');
$('hb').onclick=()=>{hnt++;hl=k;draw();say('Нажми на точку номер '+(k+1))};
cv.onclick=e=>{const r=cv.getBoundingClientRect(),s=W/r.width,mx=(e.clientX-r.left)*s,my=(e.clientY-r.top)*s;const p=DOTS[k];if(!p)return;
if(Math.hypot(mx-X(p[0]),my-Y(p[1]))<32){k++;hl=-1;beep(300+k*60,.12);draw();if(k===DOTS.length){rec('Соедини точки',mis,hnt);confetti();$('m').innerHTML='<span class="good">Получилась арка! ⭐</span>';say('Получилась арка! Молодец!');beep(880,.3);setTimeout(stepChoose,2000)}else $('m').innerHTML='Теперь точка номер '+(k+1)}
else{mis++;$('m').innerHTML='<span class="try">Почти! Нажми на точку номер '+(k+1)+'</span>';say('Нажми на точку номер '+(k+1));beep(250);if(mis>=2){hl=k;draw()}}};
$('m').innerHTML='Нажми на точку номер 1'}
/* 4. выбор графика */
function graphSVG(kind){return kind==='par'?`<svg viewBox="0 0 200 160" width="100%"><line x1="100" y1="0" x2="100" y2="160" stroke="#222" stroke-width="3"/><line x1="0" y1="140" x2="200" y2="140" stroke="#222" stroke-width="3"/><path d="M30 10 Q100 270 170 10" fill="none" stroke="#2d6cdf" stroke-width="6"/></svg>`:`<svg viewBox="0 0 200 160" width="100%"><line x1="100" y1="0" x2="100" y2="160" stroke="#222" stroke-width="3"/><line x1="0" y1="80" x2="200" y2="80" stroke="#222" stroke-width="3"/><line x1="20" y1="150" x2="180" y2="10" stroke="#2d6cdf" stroke-width="6"/></svg>`}
let chQ=0;
function stepChoose(){chQ=0;choose()}
function choose(){mis=0;hnt=0;const want=chQ===0?'par':'line';const flip=Math.random()<.5;const A=flip?'line':'par',B=flip?'par':'line';
const q=chQ===0?'Покажи линию, похожую на АРКУ':'Покажи ПРЯМУЮ линию';
app.innerHTML=`<div class="card"><h2 style="text-align:center">${q}</h2><div class="row">${rb(q)}</div><div class="msg" id="m"></div><div class="row"><button class="alt" style="width:45%" onclick="chPick('${A}','${want}')">${graphSVG(A)}</button><button class="alt" style="width:45%" onclick="chPick('${B}','${want}')">${graphSVG(B)}</button></div></div>`;say(q)}
function chPick(k,want){if(k===want){rec(chQ===0?'Линия-арка (парабола)':'Прямая линия',mis,hnt);$('m').innerHTML='<span class="good">'+rp()+' ⭐</span>';say('Правильно!');confetti();beep(700);chQ++;setTimeout(()=>chQ>=2?stepMirror():choose(),1200)}else{mis++;$('m').innerHTML='<span class="try">Попробуй ещё раз.</span>';say('Попробуй ещё раз');beep(250)}}
/* 5. зеркало */
function stepMirror(){mis=0;hnt=0;const W=700,H=380,X=x=>350+x*150,Y=y=>330-y*70;const R=[[.5,.25],[1,1],[1.5,2.25],[2,4]];let k=0;
app.innerHTML=`<div class="card"><h2 style="text-align:center">Дострой вторую половину арки</h2><div class="row">${rb('Дострой вторую половину арки. Нажимай на оранжевые кружки справа.')}</div><div class="msg" id="m">Нажимай на оранжевые кружки</div><canvas id="cv" width="700" height="380" style="width:100%;border:3px solid var(--blue);border-radius:12px;background:#fff"></canvas></div>`;
const cv=$('cv'),g=cv.getContext('2d');
function draw(){g.clearRect(0,0,W,H);g.strokeStyle='#c0392b';g.setLineDash([10,8]);g.lineWidth=3;g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.stroke();g.setLineDash([]);g.strokeStyle='#8d6e63';g.lineWidth=10;g.beginPath();[[-2,4],[-1.5,2.25],[-1,1],[-.5,.25],[0,0]].forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.stroke();
if(k>0){g.beginPath();g.moveTo(X(0),Y(0));R.slice(0,k).forEach(p=>g.lineTo(X(p[0]),Y(p[1])));g.stroke()}
R.forEach((p,i)=>{if(i>=k){g.beginPath();g.arc(X(p[0]),Y(p[1]),i===k?22:14,0,6.28);g.fillStyle=i===k?'#f08a24':'#ffd7a8';g.fill()}})}
draw();say('Дострой вторую половину арки. Нажимай на оранжевые кружки справа.');
cv.onclick=e=>{const r=cv.getBoundingClientRect(),s=W/r.width,mx=(e.clientX-r.left)*s,my=(e.clientY-r.top)*s;const p=R[k];if(!p)return;
if(Math.hypot(mx-X(p[0]),my-Y(p[1]))<34){k++;beep(300+k*80,.12);draw();if(k===R.length){rec('Вторая половина арки (зеркало)','tutor');confetti();$('m').innerHTML='<span class="good">Арка готова! Обе половинки одинаковые ⭐</span>';say('Арка готова! Обе половинки одинаковые. Молодец!');setTimeout(()=>showResults("lesson('a','startA()')"),2400)}}
else{mis++;$('m').innerHTML='<span class="try">Нажми на большой оранжевый кружок</span>';say('Нажми на большой оранжевый кружок');beep(250)}}}
function home(){const txt=STORY.join(' ');
app.innerHTML=`<div class="card"><div class="emoji">🌉</div><h2 style="text-align:center">Мастер арок</h2>${STORY.map(p=>'<p style="text-align:center;font-size:28px">'+p+'</p>').join('')}
<div class="row">${rb(txt)}</div><div class="row"><button class="big ok" onclick="lesson('a','startA()')">🌉 Начать!</button></div></div>`;say(txt)}

home();
</script></body></html>
