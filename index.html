<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хранитель оркестра · Жидкие тела</title>
<style>
:root{--bg:#f3f7fb;--card:#fff;--ink:#1f2d3d;--blue:#2d6cdf;--green:#2e9e5b;--orange:#f08a24;--soft:#e6eefb}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:22px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 10px #0001;margin-bottom:16px}
h1{font-size:34px;margin:6px 0}h2{font-size:28px;margin:4px 0 12px}
button{font:inherit;border:none;border-radius:16px;padding:16px 22px;margin:6px;cursor:pointer;background:var(--blue);color:#fff;min-width:140px;min-height:64px}
button:hover{filter:brightness(1.08)}button:focus{outline:4px solid #ffd54a}
button.alt{background:#fff;color:var(--ink);border:3px solid var(--blue)}
button.big{font-size:30px;min-width:220px;min-height:110px}
button.ok{background:var(--green)}button.soft{background:var(--soft);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.msg{min-height:56px;font-size:26px;text-align:center;margin:10px 0;font-weight:600}
.good{color:var(--green)}.try{color:var(--orange)}
.stars{font-size:32px;text-align:center;letter-spacing:4px}
.emoji{font-size:90px;text-align:center;line-height:1.1}
.prog{height:16px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
table{border-collapse:collapse;width:100%;font-size:19px}td,th{border:2px solid #cbd7ea;padding:8px;text-align:center}
input[type=text],input[type=number]{font:inherit;padding:12px;border:3px solid var(--blue);border-radius:12px;width:180px;text-align:center}
.small{font-size:17px;color:#51627a}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
#balloon{font-size:130px;transition:transform .25s;display:inline-block}
.hint{background:#fff8e1;border-radius:12px;padding:10px;font-size:20px}
@media print{.top,button,.small,#rep ~ *{display:none!important}body{background:#fff;font-size:16px}.card{box-shadow:none}.card:not(#rep){display:none}input,select{border:none!important}}</style></head><body><div class="wrap">
<div class="top"><h1>🎻 Хранитель оркестра</h1><div><button class="soft" onclick="home()">🏠 Меню</button><button class="soft" id="vc" onclick="toggleVoice()">🗣️ Озвучка вкл.</button><button class="soft" onclick="glossary()">📖 Словарик</button><button class="soft" id="snd" onclick="toggleSound()">🔇 Звуки выкл.</button></div></div>
<div id="app"></div>
<p class="small">Тут нельзя проиграть. Кнопка «🔊 Прочитать» читает текст вслух; озвучку можно выключить вверху. Ошибся — попробуй ещё раз. Подсказка всегда рядом.</p>
</div>
<script>
const $=id=>document.getElementById(id);const app=$('app');
let sound=false,stars=0,AC;
function beep(f,d=0.15){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=0.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function toggleSound(){sound=!sound;$('snd').textContent=sound?'🔊 Звуки вкл.':'🔇 Звуки выкл.';beep(660)}
const praise=['Молодец!','Отлично!','Правильно!','Супер!','Здорово!'];
const rp=()=>praise[Math.floor(Math.random()*praise.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function starsHTML(){return '⭐'.repeat(stars)||'☆'}

let voice=true;
function say(t){if(!voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,' ').replace(/[₁₂]/g,m=>m=='₁'?' один':' два').replace(/\*/g,' умножить на ').replace(/=/g,' равно '));u.lang='ru-RU';u.rate=0.85;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith('ru'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function sayNow(t){const o=voice;voice=true;say(t);voice=o}
function toggleVoice(){voice=!voice;$('vc').textContent=voice?'🗣️ Озвучка вкл.':'🗣️ Озвучка выкл.';if(voice)say('Озвучка включена');else if('speechSynthesis' in window)speechSynthesis.cancel()}
function rb(t){return `<button class="soft" onclick="sayNow(this.dataset.t)" data-t="${t.replace(/"/g,'&quot;').replace(/<[^>]+>/g,' ')}">🔊 Прочитать</button>`}
let lessonKey,lessonI,lessonNext;
function lesson(k,next){lessonKey=k;lessonI=0;lessonNext=next;showLesson()}
function showLesson(){const L=LESSONS[lessonKey],x=L[lessonI];
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${(lessonI+1)/L.length*100}%"></i></div><div class="emoji">${x.e}</div><h2 style="text-align:center">${x.t}</h2><p style="text-align:center;font-size:26px">${x.x}</p>
<div class="row">${rb(x.t+'. '+x.x)}</div>
<div class="row">${lessonI>0?'<button class="alt" onclick="lessonI--;showLesson()">⬅ Назад</button>':''}
${lessonI<L.length-1?'<button class="ok" onclick="lessonI++;showLesson()">Дальше ➜</button>':'<button class="ok" onclick="'+lessonNext+'">🎮 Играть!</button>'}</div></div>`;say(x.t+'. '+x.x)}
function confetti(){const c=document.createElement('canvas');c.width=innerWidth;c.height=innerHeight;c.style.cssText='position:fixed;left:0;top:0;pointer-events:none;z-index:99';document.body.appendChild(c);const g=c.getContext('2d');const P=[];for(let i=0;i<70;i++)P.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:5+Math.random()*6,h:Math.random()*360,a:1});let f=0;(function t(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.a-=.012;g.globalAlpha=Math.max(p.a,0);g.fillStyle=`hsl(${p.h},85%,55%)`;g.fillRect(p.x,p.y,p.r,p.r)});if(++f<90)requestAnimationFrame(t);else c.remove()})()}

/* ===== ASSESSMENT ===== */
let RES=[],mis=0,hnt=0,curLevel='';
const LVL={low:'Низкий уровень',mid1:'Уровень ниже среднего',mid2:'Средний уровень'};
const PTS=[100,80,60,40,40];
function rec(name,m,h){const tutor=(m==='tutor');const pts=tutor?100:PTS[Math.min(4,(m||0)+(h||0))];RES=RES.filter(r=>r.name!==name);RES.push({name,pts,tutor,m:tutor?0:m,h:tutor?0:h})}
function grade(p){return p>=95?'A':p>=90?'A−':p>=85?'B+':p>=80?'B':p>=75?'B−':p>=70?'C+':p>=65?'C':p>=60?'C−':p>=55?'D+':p>=50?'D':'F'}
function avg(){return RES.length?Math.round(RES.reduce((s,r)=>s+r.pts,0)/RES.length):0}
function showResults(next){const a=avg(),zach=a>=50;
const msg=a>=80?'Ты справился отлично!':a>=50?'Хорошо получилось! Ты молодец!':'Ты старался! Давай попробуем ещё раз — получится лучше!';
app.innerHTML=`<div class="card"><div class="emoji">🏆</div><h2 style="text-align:center">${msg}</h2>
<p class="stars">${'⭐'.repeat(Math.max(1,Math.round(a/20)))}</p>
<p style="text-align:center;font-size:44px;margin:4px"><b>${a} баллов</b></p>
<p style="text-align:center;font-size:26px">Оценка: <b>${grade(a)}</b> · ${zach?'<span class="good">зачтено ✅</span>':'<span class="try">ещё потренируемся</span>'}</p>
<div class="row">${rb(msg+' У тебя '+a+' баллов.')}<button class="ok" onclick="${next}">Играть ещё</button><button class="alt" onclick="home()">В меню</button></div></div>
<div class="card" id="rep"><h2>📋 Лист оценивания (для педагога)</h2>
<div class="row"><label>ФИО: <input type="text" id="fio" style="width:260px"></label><label>Дата: <input type="text" id="dt" style="width:150px" value="${new Date().toLocaleDateString('ru-RU')}"></label></div>
<p><b>${LVL[curLevel]||''}</b> · Тема 10. Газовые законы</p>
<table id="rt"><tr><th>№</th><th>Задание</th><th>Ошибки / подсказки</th><th>Баллы</th></tr>
${RES.map((r,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${r.name}</td><td>${r.tutor?'оценивает педагог':r.m+' / '+r.h}</td><td>${r.tutor?`<select onchange="RES[${i}].pts=+this.value;updRes()" style="font-size:18px">${[100,80,60,40,0].map(v=>`<option ${v===r.pts?'selected':''}>${v}</option>`).join('')}</select>`:r.pts}</td></tr>`).join('')}
<tr><th colspan="3" style="text-align:right">Средний балл</th><th id="tot">${a}</th></tr></table>
<p id="gr2" style="font-size:22px"><b>Оценка: ${grade(a)} · ${zach?'зачтено':'не зачтено'}</b></p>
<p class="small">Баллы за задание: без ошибок и подсказок — 100; одна ошибка или подсказка — 80; две — 60; три и больше — 40; не выполнено — 0. Задания-действия (опыты, лаборатория) оценивает педагог или тьютор по уровню помощи. Шкала: A 95–100, A− 90–94, B+ 85–89, B 80–84, B− 75–79, C+ 70–74, C 65–69, C− 60–64, D+ 55–59, D 50–54, F 0–49. Зачёт — от 50 баллов.</p>
<div class="row"><button class="soft" onclick="window.print()">🖨️ Печать / PDF</button></div></div>`;
say(msg+' У тебя '+a+' баллов.');confetti()}
function updRes(){const a=avg();$('tot').textContent=a;$('gr2').innerHTML='<b>Оценка: '+grade(a)+' · '+(a>=50?'зачтено':'не зачтено')+'</b>'}
function done(next){showResults(next)}


/* ===== ТЕМА 12: ЖИДКИЕ ТЕЛА (уровень В) ===== */
const END='Зал в порядке! Скрипки и домбры звучат чисто. Ты настоящий хранитель оркестра!';
const STORY=['Ты — хранитель музыкального зала. В зале живут скрипки, гитары и домбры.','Они сделаны из дерева. Если воздух слишком сухой — дерево трескается. Если слишком сырой — разбухает, и звук пропадает.','Чтобы сохранить инструменты, нужно понять воду и воздух: влажность, точку росы, поверхностное натяжение и капилляры.','Начинаем?'];
LVL.v='Уровень В (средний)';
const LESSONS={v:[
{e:'💧',t:'Жидкость',x:'Жидкость течёт и принимает форму сосуда. Вода — жидкость. У жидкости есть поверхность, и она ведёт себя особенно.'},
{e:'🌫️',t:'Влажность воздуха',x:'В воздухе есть водяной пар. Влажность показывает, сколько пара в воздухе. Её измеряют в процентах гигрометром. Относительная влажность: фи равно p делить на p-насыщенное, умножить на сто процентов. Для людей и инструментов хорошо от сорока до шестидесяти процентов.'},
{e:'🥛',t:'Точка росы',x:'Точка росы — температура, при которой пар в воздухе начинает превращаться в капельки воды. Поэтому холодный стакан запотевает. Чем влажнее воздух, тем выше точка росы.'},
{e:'🪡',t:'Поверхностное натяжение',x:'Поверхность воды похожа на тонкую упругую плёнку. Поэтому капля круглая, а водомерка и иголка могут держаться на воде. Мыло уменьшает натяжение, и иголка тонет.'},
{e:'🫧',t:'Смачивание',x:'Вода смачивает чистое стекло и растекается по нему. На жирной поверхности вода собирается в шарики — это несмачивание. Ртуть на стекле тоже не смачивает.'},
{e:'🌱',t:'Капилляры',x:'Капилляр — очень узкая трубочка. В ней смачивающая жидкость поднимается вверх. Чем уже трубка, тем выше поднимается вода. Так вода впитывается в полотенце, поднимается по растениям и по дереву.'},
{e:'🎻',t:'Связь с музыкой',x:'Музыкальные инструменты сделаны из дерева. Дерево впитывает влагу через капилляры. В сухом воздухе оно трескается, во влажном — разбухает. Поэтому в зале поддерживают влажность от сорока до шестидесяти процентов.'}]};
function glossary(){const all=[['Влажность воздуха','сколько водяного пара в воздухе; измеряют гигрометром'],['Относительная влажность','φ = p / pн · 100 %'],['Точка росы','температура, при которой пар превращается в росу'],['Поверхностное натяжение','упругая «плёнка» на поверхности жидкости'],['Смачивание','жидкость растекается по поверхности (вода на стекле)'],['Несмачивание','жидкость собирается в шарики (вода на жире, ртуть на стекле)'],['Капилляр','очень узкая трубка; жидкость в ней поднимается'],['Гигрометр','прибор для измерения влажности']];
app.innerHTML='<div class="card"><h2>📖 Словарик</h2><table>'+all.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td>${rb(a[0]+'. '+a[1])}</td></tr>`).join('')+'</table><div class="row"><button class="alt" onclick="home()">В меню</button></div></div>'}

function labShell(title,body,M,next,intro){
app.innerHTML=`<div class="card"><h2>${title}</h2>${body}<div class="msg" id="m"></div><div id="ml" style="font-size:22px;margin:8px 0"></div></div>`;
const done=M.map(()=>false);
const chk=()=>{M.forEach((m,i)=>{if(!done[i]&&m[1]()){done[i]=true;confetti();beep(700);say(m[2]||'Получилось!')}});
$('ml').innerHTML=M.map((m,i)=>(done[i]?'✅ ':'⬜ ')+m[0]).join('<br>');
if(done.every(x=>x)&&!$('nx')){rec('Лаборатория: '+title,'tutor');app.querySelector('.card').insertAdjacentHTML('beforeend','<div class="row"><button class="ok" id="nx">Дальше ➜</button></div>');$('nx').onclick=next}};
chk();say(intro+' '+M.map(m=>m[0]).join('. '));return chk}

/* ---- Лаборатория 1: музыкальный зал ---- */
function labHum(next){let H=25,wet=false,back=false;let chk;
const draw=()=>{const cv=$('cv'),g=cv.getContext('2d');g.clearRect(0,0,700,320);g.fillStyle='#fff';g.fillRect(0,0,700,320);
const cx=190,cy=270,R=150;[[0,40,'#f5c542'],[40,60,'#2e9e5b'],[60,100,'#4aa3df']].forEach(z=>{g.beginPath();g.arc(cx,cy,R,Math.PI+z[0]/100*Math.PI,Math.PI+z[1]/100*Math.PI);g.arc(cx,cy,R-40,Math.PI+z[1]/100*Math.PI,Math.PI+z[0]/100*Math.PI,true);g.closePath();g.fillStyle=z[2];g.fill()});
g.fillStyle='#1f2d3d';g.font='bold 18px sans-serif';g.textAlign='center';g.fillText('сухо',cx-110,cy+22);g.fillText('норма',cx,cy-R-8);g.fillText('сыро',cx+110,cy+22);
const a=Math.PI+H/100*Math.PI;g.strokeStyle='#c0392b';g.lineWidth=6;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*(R-20),cy+Math.sin(a)*(R-20));g.stroke();g.beginPath();g.arc(cx,cy,10,0,6.28);g.fillStyle='#1f2d3d';g.fill();
g.font='bold 34px sans-serif';g.fillText(H+' %',cx,cy+60);
g.font='120px serif';g.fillText('🎻',500,170);
if(H<40){g.strokeStyle='#5a3a1a';g.lineWidth=3;g.beginPath();g.moveTo(470,90);g.lineTo(485,120);g.lineTo(475,145);g.lineTo(492,175);g.stroke();g.font='bold 20px sans-serif';g.fillStyle='#8a5a00';g.fillText('Дерево сохнет: трещины!',500,230)}
else if(H>60){g.font='38px serif';['💧','💧','💧'].forEach((d,i)=>g.fillText(d,430+i*70,90+(i%2)*20));g.font='bold 20px sans-serif';g.fillStyle='#1f5fa8';g.fillText('Дерево разбухло: звук глухой',500,230)}
else{g.font='bold 20px sans-serif';g.fillStyle='#1e7e45';g.fillText('Инструмент в порядке ♪',500,230)}};
const body=`<canvas id="cv" width="700" height="320" style="width:100%;border-radius:12px;background:#fff"></canvas><div class="row"><button onclick="W.h(10)">💧 Увлажнить</button><button onclick="W.h(-10)">🌬️ Осушить</button></div>`;
window.W={h(d){H=Math.max(0,Math.min(100,H+d));if(H>=80)wet=true;if(wet&&H>=40&&H<=60)back=true;beep(300+H*4,.1);draw();chk()}};
chk=labShell('Лаборатория: музыкальный зал',body,[['Доведи влажность до нормы 40–60 %',()=>H>=40&&H<=60,'Влажность в норме. Инструмент в порядке.'],['Увлажни до 80 % и посмотри, что с деревом',()=>H>=80,'Слишком сыро. Дерево разбухло.'],['Осуши зал обратно до нормы',()=>back,'Зал снова в порядке.']],next,'Следи за влажностью в зале.');draw()}

/* ---- Лаборатория 2: точка росы ---- */
function Td(T,phi){const a=17.27,b=237.7,g=Math.log(phi/100)+a*T/(b+T);return b*g/(a-g)}
function labDew(next){let Tg=25,phi=60,chk;const air=25;const dots=[];for(let i=0;i<46;i++)dots.push([Math.random(),Math.random(),3+Math.random()*4]);
const draw=()=>{const cv=$('cv'),g=cv.getContext('2d');g.clearRect(0,0,700,320);g.fillStyle='#fff';g.fillRect(0,0,700,320);
const td=Td(air,phi);g.fillStyle='#1f2d3d';g.font='bold 20px sans-serif';g.textAlign='left';g.fillText('Воздух: '+air+' °C, влажность '+phi+' %',20,34);g.fillStyle='#c0392b';g.fillText('Точка росы ≈ '+td.toFixed(1)+' °C',20,64);
const x0=270,y0=80,w=160,h=200;const k=(25-Tg)/25;g.fillStyle=`rgb(${Math.round(200-k*120)},${Math.round(225-k*80)},255)`;g.fillRect(x0,y0,w,h);g.strokeStyle='#1f2d3d';g.lineWidth=4;g.strokeRect(x0,y0,w,h);
g.fillStyle='#1f2d3d';g.font='bold 22px sans-serif';g.textAlign='center';g.fillText('стакан '+Tg+' °C',x0+w/2,y0+h+32);
if(Tg<=td){const n=Math.min(46,Math.round((td-Tg)*5+6));g.fillStyle='rgba(255,255,255,.9)';g.strokeStyle='#4aa3df';g.lineWidth=2;for(let i=0;i<n;i++){const d=dots[i];const px=x0+8+d[0]*(w-16),py=y0+8+d[1]*(h-16);g.beginPath();g.arc(px,py,d[2],0,6.28);g.fill();g.stroke()}
g.fillStyle='#1f5fa8';g.font='bold 20px sans-serif';g.textAlign='left';g.fillText('Роса! Стакан запотел',450,170)}else{g.fillStyle='#51627a';g.font='20px sans-serif';g.textAlign='left';g.fillText('Стакан сухой. Охлаждай дальше ❄️',440,170)}};
const body=`<canvas id="cv" width="700" height="320" style="width:100%;border-radius:12px;background:#fff"></canvas><div class="row"><label style="font-size:22px">Температура стакана: <input type="range" id="tg" min="0" max="25" step="1" value="25"> </label></div><div class="row"><button class="alt" onclick="W.p(40)">Влажность 40 %</button><button class="alt" onclick="W.p(60)">Влажность 60 %</button><button class="alt" onclick="W.p(80)">Влажность 80 %</button></div>`;
window.W={p(v){phi=v;beep(400,.1);draw();chk()}};
chk=labShell('Лаборатория: точка росы',body,[['Влажность 60 %: охлаждай стакан, пока не выступит роса',()=>phi==60&&Tg<=Td(air,60),'Роса выступила при 16 или ниже градусах.'],['Влажность 40 %: воздух суше — роса появится при более низкой температуре',()=>phi==40&&Tg<=Td(air,40),'В сухом воздухе точка росы ниже.'],['Влажность 80 %: роса выступит уже при 21 градусе',()=>phi==80&&Tg<=Td(air,80),'Чем влажнее воздух, тем выше точка росы.']],next,'Охлаждай стакан и смотри, когда появится роса.');
$('tg').oninput=e=>{Tg=+e.target.value;draw();chk()};draw()}

/* ---- Лаборатория 3: поверхностное натяжение ---- */
function labTension(next){let st=0,y=0,chk;
const draw=()=>{const cv=$('cv');if(!cv)return;const g=cv.getContext('2d');g.clearRect(0,0,700,320);g.fillStyle='#fff';g.fillRect(0,0,700,320);
g.fillStyle='#bfe0ff';g.fillRect(0,170,700,150);g.strokeStyle='#4aa3df';g.lineWidth=3;g.beginPath();g.moveTo(0,170);
const nx=350,dip=(st===1)?18:0;for(let x=0;x<=700;x+=5){const d=dip*Math.exp(-Math.pow((x-nx)/40,2));g.lineTo(x,170+d)}g.stroke();
if(st===1){g.fillStyle='#555';g.fillRect(nx-45,170+18-6,90,6)}else if(st>=2){g.fillStyle='#555';g.save();g.translate(nx,170+y);g.rotate(y>80?0.5:0);g.fillRect(-45,-3,90,6);g.restore()}
g.fillStyle='#1f2d3d';g.font='bold 20px sans-serif';g.textAlign='left';g.fillText(st===0?'Положи иголку на воду':st===1?'Иголка держится на «плёнке»!':st===2?'Мыло ослабило натяжение...':'Иголка утонула',20,36);
g.beginPath();g.ellipse(600,60,26,34,0,0,6.28);g.fillStyle='#bfe0ff';g.fill();g.strokeStyle='#4aa3df';g.stroke();g.fillStyle='#1f2d3d';g.font='16px sans-serif';g.textAlign='center';g.fillText('капля круглая',600,115);
if(st===2){y+=4;if(y>=130){st=3;chk()}}if(cv.isConnected)requestAnimationFrame(draw)};
const body=`<canvas id="cv" width="700" height="320" style="width:100%;border-radius:12px;background:#fff"></canvas><div class="row"><button onclick="W.n()">🪡 Положить иголку</button><button onclick="W.s()">🧼 Капнуть мыло</button><button class="alt" onclick="W.r()">🔄 Заново</button></div>`;
window.W={n(){if(st===0){st=1;y=0;beep(500,.1);chk()}},s(){if(st===1){st=2;beep(300,.2)}},r(){st=0;y=0}};
chk=labShell('Лаборатория: поверхностное натяжение',body,[['Положи иголку на воду — она не тонет!',()=>st>=1,'Поверхность воды держит иголку.'],['Капни мыло — иголка утонет',()=>st===3,'Мыло уменьшает поверхностное натяжение.']],next,'Проведи опыт с иголкой.');draw()}

/* ---- Лаборатория 4: капилляры ---- */
function labCap(next){let t=0,anim=false,picked={hi:false,lo:false},chk;const W3=[12,26,52],Hh=[160,80,40],XS=[140,350,560];
const draw=()=>{const cv=$('cv');if(!cv)return;const g=cv.getContext('2d');g.clearRect(0,0,700,340);g.fillStyle='#fff';g.fillRect(0,0,700,340);
g.fillStyle='#bfe0ff';g.fillRect(0,260,700,80);g.strokeStyle='#4aa3df';g.lineWidth=3;g.beginPath();g.moveTo(0,260);g.lineTo(700,260);g.stroke();
for(let i=0;i<3;i++){const w=W3[i],x=XS[i];const top=260-Hh[i]*t;g.fillStyle='#bfe0ff';g.fillRect(x-w/2,top,w,300-top);g.strokeStyle='#1f2d3d';g.lineWidth=4;g.beginPath();g.moveTo(x-w/2,40);g.lineTo(x-w/2,300);g.moveTo(x+w/2,40);g.lineTo(x+w/2,300);g.stroke();
g.fillStyle='#1f2d3d';g.font='bold 18px sans-serif';g.textAlign='center';g.fillText(['узкая','средняя','широкая'][i],x,28)}
if(anim){t=Math.min(1,t+0.02);if(t>=1){anim=false;chk()}}if(cv.isConnected)requestAnimationFrame(draw)};
const body=`<canvas id="cv" width="700" height="340" style="width:100%;border-radius:12px;background:#fff;cursor:pointer"></canvas><div class="row"><button onclick="W.go()">⬇️ Опустить трубки в воду</button></div>`;
window.W={go(){if(t===0){anim=true;beep(400,.2)}}};
chk=labShell('Лаборатория: капилляры',body,[['Опусти трубки в воду и смотри',()=>t>=1,'Вода поднялась в трубках.'],['Нажми на трубку, где вода поднялась ВЫШЕ всего',()=>picked.hi,'Верно! Чем уже трубка, тем выше вода.'],['Нажми на самую широкую трубку, где вода ниже всего',()=>picked.lo,'Верно! В широкой трубке вода поднялась меньше.']],next,'Опусти трубки в воду и сравни.');
$('cv').onclick=e=>{if(t<1)return;const r=$('cv').getBoundingClientRect(),x=(e.clientX-r.left)*700/r.width;const i=XS.map((v,j)=>[Math.abs(v-x),j]).sort((a,b)=>a[0]-b[0])[0][1];if(i===0)picked.hi=true;if(i===2)picked.lo=true;beep(600,.1);chk()};draw()}

/* ---- Вопросы ---- */
const QV=[
{e:'🌫️',q:'Влажность воздуха показывает…',a:['сколько в воздухе водяного пара','какая в воздухе температура','какое давление воздуха'],c:0,h:'Влажность — про водяной пар.'},
{e:'📏',q:'Каким прибором измеряют влажность?',a:['Гигрометром','Термометром','Барометром'],c:0,h:'Гигро — значит влажный.'},
{e:'🥛',q:'Когда выпадает роса?',a:['Когда воздух охладился до точки росы','Когда воздух нагрелся','Когда нет водяного пара'],c:0,h:'Холодный стакан запотевает.'},
{e:'💧',q:'Почему капля воды круглая?',a:['Из-за поверхностного натяжения','Из-за ветра','Из-за цвета воды'],c:0,h:'Поверхность воды как упругая плёнка.'},
{e:'🍳',q:'Вода на жирной сковороде собирается в шарики. Это…',a:['несмачивание','смачивание','кипение'],c:0,h:'Вода не растекается по поверхности.'},
{e:'🪟',q:'Вода на чистом стекле растекается. Это…',a:['смачивание','несмачивание','замерзание'],c:0,h:'Растекается — значит смачивает.'},
{e:'🧻',q:'Что относится к капиллярным явлениям?',a:['Полотенце впитывает воду','Камень падает в воду','Лёд тает'],c:0,h:'Вода идёт по узким каналам.'},
{e:'🎻',q:'Какая влажность хороша для музыкальных инструментов?',a:['40–60 %','10–20 %','90–100 %'],c:0,h:'Не слишком сухо и не слишком сыро.'}];
let qi=0,qt=0;const nQ=QV.length,nC=3;
function startV(){RES=[];curLevel='v';mis=0;hnt=0;qi=0;qt=0;labHum(()=>labDew(()=>labTension(()=>labCap(()=>qAsk()))))}
function qAsk(){mis=0;hnt=0;if(qi>=nQ)return calc();const x=QV[qi];const opts=shuffle(x.a.map((t,i)=>({t,i})));
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${qi/(nQ+nC)*100}%"></i></div><div class="emoji">${x.e}</div><h2 style="text-align:center">${x.q}</h2><div class="msg" id="m"></div><div class="row">${rb(x.q+' '+x.a.join('. '))}</div>
<div class="row">${opts.map(o=>`<button class="big" style="font-size:22px;min-width:240px" onclick="qPick(${o.i===x.c},this)">${o.t}</button>`).join('')}</div><div class="row"><button class="soft" onclick="hnt++;$('hh').style.display='block';sayNow('${x.h}')">💡 Подсказка</button></div><div class="hint" id="hh" style="display:none">${x.h}</div></div>`;say(x.q)}
function qPick(ok,b){if(ok){rec('Вопрос: '+QV[qi].q,mis,hnt);$('m').innerHTML='<span class="good">'+rp()+' ⭐</span>';say('Правильно!');beep(700);confetti();qi++;setTimeout(qAsk,1000)}else{mis++;$('m').innerHTML='<span class="try">Почти! Открой подсказку и попробуй ещё раз.</span>';say('Попробуй ещё раз');b.style.opacity=.35;beep(250)}}
/* расчёты */
let ct=0,ctask;
function calc(){ct=0;calcAsk()}
function genC(k){if(k<2){const pn=[2,3,4][Math.floor(Math.random()*3)],f=[25,50,75][Math.floor(Math.random()*3)];const p=pn*f/100;return{t:`Относительная влажность воздуха φ = p / pн · 100 %. Давление пара p = ${p} кПа, давление насыщенного пара pн = ${pn} кПа. Найди φ.`,ans:f,u:'%',f:'φ = p / pн · 100 %',h:`Подставь: ${p} / ${pn} · 100`,name:'Расчёт влажности'}}
const td=[10,16,21][Math.floor(Math.random()*3)],yes=Math.random()<.5,tg=yes?td-4:td+4;return{t:`Точка росы воздуха ${td} °C. Стакан охладили до ${tg} °C. Выпадет ли роса? Введи 1, если ДА, и 0, если НЕТ.`,ans:yes?1:0,u:'(1 — да, 0 — нет)',f:'Роса выпадает, если стакан холоднее точки росы',h:`Сравни ${tg} и ${td}: роса есть, если стакан холоднее точки росы.`,name:'Точка росы: выпадет ли роса'}}
function calcAsk(){if(ct>=nC)return showResults("lesson('v','startV()')");ctask=genC(ct);mis=0;hnt=0;
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${(nQ+ct)/(nQ+nC)*100}%"></i></div><h2>Задача ${ct+1} из ${nC}</h2><p>${ctask.t}</p><p class="small">Дано → Найти → Решение → Ответ</p>
<div class="row"><span>Ответ: </span><input type="number" id="ans" inputmode="decimal"><span>${ctask.u}</span></div><div class="msg" id="m"></div>
<div class="row"><button class="ok" onclick="cCheck()">Проверить</button><button class="soft" onclick="cHint(1)">💡 Подсказка 1</button><button class="soft" onclick="cHint(2)">💡 Подсказка 2</button>${rb(ctask.t)}</div><div class="hint" id="hh" style="display:none"></div></div>`;say(ctask.t)}
function cHint(n){hnt++;const h=$('hh');h.style.display='block';h.innerHTML=n===1?'Формула: <b>'+ctask.f+'</b>':ctask.h;say(h.textContent)}
function cCheck(){const v=parseFloat($('ans').value.replace(',','.'));if(Math.abs(v-ctask.ans)<0.01){rec('Задача '+(ct+1)+': '+ctask.name,mis,hnt);$('m').innerHTML='<span class="good">'+rp()+' ⭐</span>';say('Верно!');beep(700);confetti();ct++;setTimeout(calcAsk,1300)}else{mis++;$('m').innerHTML='<span class="try">Пока не то. Открой подсказку и попробуй ещё раз.</span>';say('Попробуй ещё раз');beep(250);if(mis>=2)cHint(2)}}
function home(){const txt=STORY.join(' ');
app.innerHTML=`<div class="card"><div class="emoji">🎻🪕</div><h2 style="text-align:center">Хранитель оркестра</h2>${STORY.map(p=>'<p style="text-align:center;font-size:26px">'+p+'</p>').join('')}
<div class="row">${rb(txt)}</div><div class="row"><button class="big ok" onclick="lesson('v','startV()')">🎻 Начать!</button></div></div>`;say(txt)}

home();
</script></body></html>
