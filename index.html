<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мастер арок · Степенная функция</title>
<style>
:root{--bg:#f3f7fb;--card:#fff;--ink:#1f2d3d;--blue:#2d6cdf;--green:#2e9e5b;--orange:#f08a24;--soft:#e6eefb}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:22px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 10px #0001;margin-bottom:16px}
h1{font-size:34px;margin:6px 0}h2{font-size:28px;margin:4px 0 12px}
button{font:inherit;border:none;border-radius:16px;padding:16px 22px;margin:6px;cursor:pointer;background:var(--blue);color:#fff;min-width:140px;min-height:64px}
button:hover{filter:brightness(1.08)}button:focus{outline:4px solid #ffd54a}
button.alt{background:#fff;color:var(--ink);border:3px solid var(--blue)}
button.big{font-size:30px;min-width:220px;min-height:110px}
button.ok{background:var(--green)}button.soft{background:var(--soft);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.msg{min-height:56px;font-size:26px;text-align:center;margin:10px 0;font-weight:600}
.good{color:var(--green)}.try{color:var(--orange)}
.stars{font-size:32px;text-align:center;letter-spacing:4px}
.emoji{font-size:90px;text-align:center;line-height:1.1}
.prog{height:16px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
table{border-collapse:collapse;width:100%;font-size:19px}td,th{border:2px solid #cbd7ea;padding:8px;text-align:center}
input[type=text],input[type=number]{font:inherit;padding:12px;border:3px solid var(--blue);border-radius:12px;width:180px;text-align:center}
.small{font-size:17px;color:#51627a}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
#balloon{font-size:130px;transition:transform .25s;display:inline-block}
.hint{background:#fff8e1;border-radius:12px;padding:10px;font-size:20px}
@media print{.top,button,.small,#rep ~ *{display:none!important}body{background:#fff;font-size:16px}.card{box-shadow:none}.card:not(#rep){display:none}input,select{border:none!important}}</style></head><body><div class="wrap">
<div class="top"><h1>🌉 Мастер арок</h1><div><button class="soft" onclick="home()">🏠 Меню</button><button class="soft" id="vc" onclick="toggleVoice()">🗣️ Озвучка вкл.</button><button class="soft" onclick="glossary()">📖 Словарик</button><button class="soft" id="snd" onclick="toggleSound()">🔇 Звуки выкл.</button></div></div>
<div id="app"></div>
<p class="small">Тут нельзя проиграть. Кнопка «🔊 Прочитать» читает текст вслух; озвучку можно выключить вверху. Ошибся — попробуй ещё раз. Подсказка всегда рядом.</p>
</div>
<script>
const $=id=>document.getElementById(id);const app=$('app');
let sound=false,stars=0,AC;
function beep(f,d=0.15){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=0.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function toggleSound(){sound=!sound;$('snd').textContent=sound?'🔊 Звуки вкл.':'🔇 Звуки выкл.';beep(660)}
const praise=['Молодец!','Отлично!','Правильно!','Супер!','Здорово!'];
const rp=()=>praise[Math.floor(Math.random()*praise.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function starsHTML(){return '⭐'.repeat(stars)||'☆'}

let voice=true;
function say(t){if(!voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,' ').replace(/[₁₂]/g,m=>m=='₁'?' один':' два').replace(/\*/g,' умножить на ').replace(/=/g,' равно '));u.lang='ru-RU';u.rate=0.85;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith('ru'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function sayNow(t){const o=voice;voice=true;say(t);voice=o}
function toggleVoice(){voice=!voice;$('vc').textContent=voice?'🗣️ Озвучка вкл.':'🗣️ Озвучка выкл.';if(voice)say('Озвучка включена');else if('speechSynthesis' in window)speechSynthesis.cancel()}
function rb(t){return `<button class="soft" onclick="sayNow(this.dataset.t)" data-t="${t.replace(/"/g,'&quot;').replace(/<[^>]+>/g,' ')}">🔊 Прочитать</button>`}
let lessonKey,lessonI,lessonNext;
function lesson(k,next){lessonKey=k;lessonI=0;lessonNext=next;showLesson()}
function showLesson(){const L=LESSONS[lessonKey],x=L[lessonI];
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${(lessonI+1)/L.length*100}%"></i></div><div class="emoji">${x.e}</div><h2 style="text-align:center">${x.t}</h2><p style="text-align:center;font-size:26px">${x.x}</p>
<div class="row">${rb(x.t+'. '+x.x)}</div>
<div class="row">${lessonI>0?'<button class="alt" onclick="lessonI--;showLesson()">⬅ Назад</button>':''}
${lessonI<L.length-1?'<button class="ok" onclick="lessonI++;showLesson()">Дальше ➜</button>':'<button class="ok" onclick="'+lessonNext+'">🎮 Играть!</button>'}</div></div>`;say(x.t+'. '+x.x)}
function confetti(){const c=document.createElement('canvas');c.width=innerWidth;c.height=innerHeight;c.style.cssText='position:fixed;left:0;top:0;pointer-events:none;z-index:99';document.body.appendChild(c);const g=c.getContext('2d');const P=[];for(let i=0;i<70;i++)P.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:5+Math.random()*6,h:Math.random()*360,a:1});let f=0;(function t(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.a-=.012;g.globalAlpha=Math.max(p.a,0);g.fillStyle=`hsl(${p.h},85%,55%)`;g.fillRect(p.x,p.y,p.r,p.r)});if(++f<90)requestAnimationFrame(t);else c.remove()})()}

/* ===== ASSESSMENT ===== */
let RES=[],mis=0,hnt=0,curLevel='';
const LVL={low:'Низкий уровень',mid1:'Уровень ниже среднего',mid2:'Средний уровень'};
const PTS=[100,80,60,40,40];
function rec(name,m,h){const tutor=(m==='tutor');const pts=tutor?100:PTS[Math.min(4,(m||0)+(h||0))];RES=RES.filter(r=>r.name!==name);RES.push({name,pts,tutor,m:tutor?0:m,h:tutor?0:h})}
function grade(p){return p>=95?'A':p>=90?'A−':p>=85?'B+':p>=80?'B':p>=75?'B−':p>=70?'C+':p>=65?'C':p>=60?'C−':p>=55?'D+':p>=50?'D':'F'}
function avg(){return RES.length?Math.round(RES.reduce((s,r)=>s+r.pts,0)/RES.length):0}
function showResults(next){const a=avg(),zach=a>=50;
const msg=a>=80?'Ты справился отлично!':a>=50?'Хорошо получилось! Ты молодец!':'Ты старался! Давай попробуем ещё раз — получится лучше!';
app.innerHTML=`<div class="card"><div class="emoji">🏆</div><h2 style="text-align:center">${msg}</h2>
<p class="stars">${'⭐'.repeat(Math.max(1,Math.round(a/20)))}</p>
<p style="text-align:center;font-size:44px;margin:4px"><b>${a} баллов</b></p>
<p style="text-align:center;font-size:26px">Оценка: <b>${grade(a)}</b> · ${zach?'<span class="good">зачтено ✅</span>':'<span class="try">ещё потренируемся</span>'}</p>
<div class="row">${rb(msg+' У тебя '+a+' баллов.')}<button class="ok" onclick="${next}">Играть ещё</button><button class="alt" onclick="home()">В меню</button></div></div>
<div class="card" id="rep"><h2>📋 Лист оценивания (для педагога)</h2>
<div class="row"><label>ФИО: <input type="text" id="fio" style="width:260px"></label><label>Дата: <input type="text" id="dt" style="width:150px" value="${new Date().toLocaleDateString('ru-RU')}"></label></div>
<p><b>${LVL[curLevel]||''}</b> · Тема 10. Газовые законы</p>
<table id="rt"><tr><th>№</th><th>Задание</th><th>Ошибки / подсказки</th><th>Баллы</th></tr>
${RES.map((r,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${r.name}</td><td>${r.tutor?'оценивает педагог':r.m+' / '+r.h}</td><td>${r.tutor?`<select onchange="RES[${i}].pts=+this.value;updRes()" style="font-size:18px">${[100,80,60,40,0].map(v=>`<option ${v===r.pts?'selected':''}>${v}</option>`).join('')}</select>`:r.pts}</td></tr>`).join('')}
<tr><th colspan="3" style="text-align:right">Средний балл</th><th id="tot">${a}</th></tr></table>
<p id="gr2" style="font-size:22px"><b>Оценка: ${grade(a)} · ${zach?'зачтено':'не зачтено'}</b></p>
<p class="small">Баллы за задание: без ошибок и подсказок — 100; одна ошибка или подсказка — 80; две — 60; три и больше — 40; не выполнено — 0. Задания-действия (опыты, лаборатория) оценивает педагог или тьютор по уровню помощи. Шкала: A 95–100, A− 90–94, B+ 85–89, B 80–84, B− 75–79, C+ 70–74, C 65–69, C− 60–64, D+ 55–59, D 50–54, F 0–49. Зачёт — от 50 баллов.</p>
<div class="row"><button class="soft" onclick="window.print()">🖨️ Печать / PDF</button></div></div>`;
say(msg+' У тебя '+a+' баллов.');confetti()}
function updRes(){const a=avg();$('tot').textContent=a;$('gr2').innerHTML='<b>Оценка: '+grade(a)+' · '+(a>=50?'зачтено':'не зачтено')+'</b>'}
function done(next){showResults(next)}


/* ===== ТЕМА 11: СТЕПЕННАЯ ФУНКЦИЯ ===== */
const END='Мост построен! Арки получились ровными, как настоящие параболы. Ты настоящий мастер арок!';
const STORY=['Ты — мастер арок. В городе строят большой мост.','Арки моста — это графики функций! Чтобы арка получилась ровной, нужно понимать степенную функцию.','Изучи функции, построй графики по точкам и ответь на вопросы. Тогда мост откроют!','Начинаем?'];
LVL.p='Тема 11. Степенная функция';
const LESSONS={p:[
{e:'✖️',t:'Что такое степень',x:'Степень — это когда число умножают само на себя. Икс в квадрате — это икс умножить на икс. Икс в кубе — это икс умножить на икс и ещё раз на икс. Например, три в квадрате равно девять.'},
{e:'📈',t:'Степенная функция',x:'Степенная функция записывается так: игрек равно икс в степени эн. Число эн называют показателем степени. Мы выбираем икс, считаем игрек и ставим точку на графике.'},
{e:'🌉',t:'Игрек равно икс в квадрате',x:'График называется парабола. Он похож на арку моста, только перевёрнутую. Область определения — все числа. Игрек всегда больше или равен нулю. Функция чётная: график симметричен относительно оси игрек. У минус двух и двух игрек одинаковый: четыре.'},
{e:'🌀',t:'Игрек равно икс в кубе',x:'График называется кубическая парабола. Функция нечётная: у минус двух и двух игреки противоположные: минус восемь и восемь. Функция возрастает на всей числовой прямой и проходит через начало координат.'},
{e:'√',t:'Игрек равно корень из икс',x:'Это степенная функция с показателем одна вторая. Корень существует только при икс больше или равном нулю. График — половина параболы, лежащая на боку. Функция возрастает.'},
{e:'🔀',t:'Игрек равно один делить на икс',x:'Это степенная функция с показателем минус один. График называется гипербола. На ноль делить нельзя, поэтому икс не равен нулю. График состоит из двух ветвей и не пересекает оси.'},
{e:'🧮',t:'Как строить график по точкам',x:'Сначала составь таблицу: выбери несколько значений икс. Потом посчитай игрек для каждого. Затем поставь точки на координатной плоскости и соедини их плавной линией.'}]};
function glossary(){const all=[['Степень','число, умноженное само на себя несколько раз: x² = x·x'],['Показатель степени','число n в записи x в степени n'],['Степенная функция','y = xⁿ'],['Парабола','график y = x²; арка моста'],['Чётная функция','график симметричен относительно оси y; y(−x) = y(x)'],['Нечётная функция','y(−x) = −y(x); например y = x³'],['Гипербола','график y = 1/x, две ветви'],['Область определения','значения x, для которых функцию можно вычислить']];
app.innerHTML='<div class="card"><h2>📖 Словарик</h2><table>'+all.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td>${rb(a[0]+'. '+a[1])}</td></tr>`).join('')+'</table><div class="row"><button class="alt" onclick="home()">В меню</button></div></div>'}
const FN={sq:{n:'y = x²',f:x=>x*x,name:'парабола',xmin:-4,xmax:4,ymin:-1,ymax:16,pts:[-3,-2,-1,0,1,2,3]},cu:{n:'y = x³',f:x=>x*x*x,name:'кубическая парабола',xmin:-3,xmax:3,ymin:-27,ymax:27,pts:[-3,-2,-1,0,1,2,3]},rt:{n:'y = √x',f:x=>x>=0?Math.sqrt(x):NaN,name:'ветвь параболы на боку',xmin:-1,xmax:9,ymin:-1,ymax:4,pts:[0,1,4,9]},hy:{n:'y = 1/x',f:x=>x!==0?1/x:NaN,name:'гипербола',xmin:-5,xmax:5,ymin:-5,ymax:5,pts:[-4,-2,-1,-0.5,0.5,1,2,4]}};
function plotFn(cv,F,cur,pts,showLine=true){const g=cv.getContext('2d'),W=cv.width,H=cv.height,L=40,R=W-20,T0=20,B=H-30;g.clearRect(0,0,W,H);g.fillStyle='#fff';g.fillRect(0,0,W,H);
const X=x=>L+(x-F.xmin)/(F.xmax-F.xmin)*(R-L),Y=y=>B-(y-F.ymin)/(F.ymax-F.ymin)*(B-T0);
g.strokeStyle='#e3ebf7';g.lineWidth=1;g.font='13px sans-serif';g.fillStyle='#51627a';
const sx=(F.xmax-F.xmin)>12?2:1,sy=(F.ymax-F.ymin)>20?5:(F.ymax-F.ymin)>9?2:1;
for(let x=Math.ceil(F.xmin);x<=F.xmax;x+=sx){g.beginPath();g.moveTo(X(x),T0);g.lineTo(X(x),B);g.stroke();g.textAlign='center';if(x!==0)g.fillText(x,X(x),Y(0)+16)}
for(let y=Math.ceil(F.ymin/sy)*sy;y<=F.ymax;y+=sy){g.beginPath();g.moveTo(L,Y(y));g.lineTo(R,Y(y));g.stroke();g.textAlign='right';if(y!==0)g.fillText(y,X(0)-5,Y(y)+4)}
g.strokeStyle='#1f2d3d';g.lineWidth=2.5;g.beginPath();g.moveTo(L,Y(0));g.lineTo(R,Y(0));g.moveTo(X(0),T0);g.lineTo(X(0),B);g.stroke();
if(showLine){g.strokeStyle='#2d6cdf';g.lineWidth=4;let pen=false;g.beginPath();for(let px=L;px<=R;px+=2){const x=F.xmin+(px-L)/(R-L)*(F.xmax-F.xmin),y=F.f(x);if(isNaN(y)||y>F.ymax*1.2||y<F.ymin*1.2||Math.abs(y)>1e3){pen=false;continue}if(!pen){g.moveTo(px,Y(y));pen=true}else g.lineTo(px,Y(y))}g.stroke()}
if(pts){g.fillStyle='#d22';pts.forEach(p=>{g.beginPath();g.arc(X(p[0]),Y(p[1]),8,0,6.28);g.fill()})}
if(cur&&!isNaN(cur[1])){g.fillStyle='#2e9e5b';g.beginPath();g.arc(X(cur[0]),Y(cur[1]),10,0,6.28);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke()}
return{X,Y,L,R,B,T0}}
function labShell(title,body,M,next,intro){
app.innerHTML=`<div class="card"><h2>${title}</h2>${body}<div class="msg" id="m"></div><div id="ml" style="font-size:22px;margin:8px 0"></div></div>`;
const done=M.map(()=>false);
const chk=()=>{M.forEach((m,i)=>{if(!done[i]&&m[1]()){done[i]=true;confetti();beep(700);say(m[2]||'Получилось!')}});
$('ml').innerHTML=M.map((m,i)=>(done[i]?'✅ ':'⬜ ')+m[0]).join('<br>');
if(done.every(x=>x)&&!$('nx')){rec('Исследование: '+title,'tutor');app.querySelector('.card').insertAdjacentHTML('beforeend','<div class="row"><button class="ok" id="nx">Дальше ➜</button></div>');$('nx').onclick=next}};
chk();say(intro+' '+M.map(m=>m[0]).join('. '));return chk}
/* ---- Исследователь ---- */
function explore(next){let key='sq',x=2,seen={sq:false,cu:false,rt:false,hy:false},sq2=false,sq_2=false,cu2=false,cu_2=false,chk;
const draw=()=>{const F=FN[key],y=F.f(x);plotFn($('cv'),F,[x,y]);$('info').innerHTML=`<b>${F.n}</b> — ${F.name}<br>x = <b>${x}</b> → y = <b>${isNaN(y)?'не существует':Math.round(y*100)/100}</b>`};
const body=`<canvas id="cv" width="700" height="360" style="width:100%;border-radius:12px;background:#fff"></canvas><div class="row"><button class="alt" onclick="W.k('sq')">y = x²</button><button class="alt" onclick="W.k('cu')">y = x³</button><button class="alt" onclick="W.k('rt')">y = √x</button><button class="alt" onclick="W.k('hy')">y = 1/x</button></div>
<div class="row"><label style="font-size:22px">x: <input type="range" id="sx" min="-4" max="4" step="1" value="2" style="width:260px"></label></div><div class="row" style="font-size:24px" id="info"></div>`;
window.W={k(k){key=k;seen[k]=true;beep(500,.1);draw();chk()}};
chk=labShell('Исследуем функции',body,[['Посмотри все 4 графика: нажми каждую кнопку',()=>seen.sq&&seen.cu&&seen.rt&&seen.hy,'Парабола, кубическая парабола, корень и гипербола.'],['y = x²: поставь x = 2 и потом x = −2. Что с y?',()=>sq2&&sq_2,'У x и минус x значение игрек одинаковое. Функция чётная.'],['y = x³: поставь x = 2 и потом x = −2. Что с y?',()=>cu2&&cu_2,'Игреки противоположные: восемь и минус восемь. Функция нечётная.']],next,'Выбирай функцию и двигай ползунок икс.');
$('sx').oninput=e=>{x=+e.target.value;if(key==='sq'){if(x===2)sq2=true;if(x===-2)sq_2=true}if(key==='cu'){if(x===2)cu2=true;if(x===-2)cu_2=true}draw();chk()};draw()}
/* ---- Построй график ---- */
const PL=[['sq',[-2,-1,0,1,2]],['cu',[-2,-1,0,1,2]],['rt',[0,1,4,9]]];
function plotGame(next){let pi=0;go();
function go(){const [k,xs]=PL[pi],F=FN[k];let placed=[],j=0;
app.innerHTML=`<div class="card"><h2>Построй график ${pi+1} из ${PL.length}: ${F.n}</h2><table style="margin-bottom:8px"><tr><th>x</th>${xs.map(v=>'<td>'+v+'</td>').join('')}</tr><tr><th>y</th>${xs.map(v=>'<td>'+Math.round(F.f(v)*100)/100+'</td>').join('')}</tr></table><div class="msg" id="m"></div><canvas id="gc" width="700" height="420" style="width:100%;border:3px solid var(--blue);border-radius:12px;cursor:crosshair"></canvas>
<div class="row"><button class="soft" onclick="gHint()">💡 Подсказка</button>${rb('Построй график. Нажимай на сетку, чтобы поставить точки из таблицы.')}</div></div>`;
const cv=$('gc');const geo=plotFn(cv,F,null,[],false);
const ask=()=>{const x=xs[j];$('m').innerHTML='Поставь точку: x = <b>'+x+'</b>, y = <b>'+Math.round(F.f(x)*100)/100+'</b>';say('Поставь точку. x равно '+x+', y равно '+Math.round(F.f(x)*100)/100)};
window.gHint=()=>{hnt++;const x=xs[j];if(x===undefined)return;$('m').innerHTML='<span class="try">Найди x = '+x+' на нижней оси, потом y = '+Math.round(F.f(x)*100)/100+' на левой. Точка там, где они встретятся.</span>';say('Найди x на нижней оси, потом y на левой оси.')};
cv.onclick=e=>{if(j>=xs.length)return;const r=cv.getBoundingClientRect(),s=cv.width/r.width,mx=(e.clientX-r.left)*s,my=(e.clientY-r.top)*s;
const gx=Math.round(F.xmin+(mx-geo.L)/(geo.R-geo.L)*(F.xmax-F.xmin)),gy=Math.round(F.ymin+(geo.B-my)/(geo.B-geo.T0)*(F.ymax-F.ymin));const x=xs[j],y=F.f(x);
const tol=(F.ymax-F.ymin)>20?1.5:0.5;
if(gx===x&&Math.abs(my-geo.Y(y))<18){placed.push([x,y]);j++;beep(700);plotFn(cv,F,null,placed,false);
 if(j===xs.length){plotFn(cv,F,null,placed,true);rec('График '+F.n,mis,hnt);mis=0;hnt=0;confetti();say('Молодец! График готов. Это '+F.name);$('m').innerHTML='<span class="good">График готов! Это '+F.name+' ⭐</span>';app.querySelector('.card').insertAdjacentHTML('beforeend','<div class="row"><button class="ok" id="nx">'+(pi<PL.length-1?'Следующий график ➜':'Дальше ➜')+'</button></div>');$('nx').onclick=()=>{pi++;pi<PL.length?go():next()}}else{say('Правильно');ask()}}

/* ---- Вопросы ---- */
const QP=[
{e:'✖️',q:'Чему равно 3² (три в квадрате)?',a:['9','6','5'],c:0,h:'3² = 3 · 3.'},
{e:'🌉',q:'Как называется график y = x²?',a:['Парабола','Гипербола','Прямая'],c:0,h:'Он похож на арку моста.'},
{e:'🔀',q:'Как называется график y = 1/x?',a:['Гипербола','Парабола','Окружность'],c:0,h:'У него две ветви.'},
{e:'🚫',q:'Чему равен y = 1/x при x = 0?',a:['Не существует: на ноль делить нельзя','0','1'],c:0,h:'Делить на ноль нельзя.'},
{e:'🪞',q:'Функция y = x² при x = 2 и при x = −2 даёт…',a:['одинаковый y (4 и 4)','разные y','y = 0'],c:0,h:'(−2)² = (−2)·(−2) = 4.'},
{e:'🔄',q:'Функция y = x³ при x = −2 даёт…',a:['−8','8','−6'],c:0,h:'(−2)·(−2)·(−2) = −8.'},
{e:'√',q:'Функция y = √x определена при…',a:['x ≥ 0','любом x','x < 0'],c:0,h:'Корень из отрицательного числа в школе не берём.'},
{e:'📍',q:'Через какую точку проходят графики y = x² и y = x³?',a:['(0; 0)','(1; 2)','(0; 1)'],c:0,h:'0² = 0 и 0³ = 0.'}];
let qi=0,qt=0;const nQ=QP.length,nC=3;
function startP(){RES=[];curLevel='p';mis=0;hnt=0;qi=0;qt=0;explore(()=>plotGame(()=>qAsk()))}
function qAsk(){mis=0;hnt=0;if(qi>=nQ)return calc();const x=QP[qi];const opts=shuffle(x.a.map((t,i)=>({t,i})));
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${qi/(nQ+nC)*100}%"></i></div><div class="emoji">${x.e}</div><h2 style="text-align:center">${x.q}</h2><div class="msg" id="m"></div><div class="row">${rb(x.q+' '+x.a.join('. '))}</div>
<div class="row">${opts.map(o=>`<button class="big" style="font-size:22px;min-width:240px" onclick="qPick(${o.i===x.c},this)">${o.t}</button>`).join('')}</div><div class="row"><button class="soft" onclick="hnt++;$('hh').style.display='block';sayNow('${x.h}')">💡 Подсказка</button></div><div class="hint" id="hh" style="display:none">${x.h}</div></div>`;say(x.q)}
function qPick(ok,b){if(ok){rec('Вопрос: '+QP[qi].q,mis,hnt);$('m').innerHTML='<span class="good">'+rp()+' ⭐</span>';say('Правильно!');beep(700);confetti();qi++;setTimeout(qAsk,1000)}else{mis++;$('m').innerHTML='<span class="try">Почти! Открой подсказку и попробуй ещё раз.</span>';say('Попробуй ещё раз');b.style.opacity=.35;beep(250)}}
let ct=0,ctask;
function calc(){ct=0;calcAsk()}
function genC(k){if(k<2){const n=k===0?2:3,x=n===2?[3,4,5,6][Math.floor(Math.random()*4)]:[2,3,4][Math.floor(Math.random()*3)];return{t:`Функция y = x${n===2?'²':'³'}. Найди y при x = ${x}.`,ans:Math.pow(x,n),u:'',f:'y = x'+(n===2?'²':'³')+(n===2?' = x · x':' = x · x · x'),h:`Посчитай: ${Array(n).fill(x).join(' · ')}`,name:'Значение y = x'+(n===2?'²':'³')}}
const x=[-2,-3][Math.floor(Math.random()*2)];return{t:`Функция y = x². Найди y при x = ${x}.`,ans:x*x,u:'',f:'y = x · x. Минус на минус даёт плюс',h:`(${x}) · (${x}) = ?`,name:'Значение y = x² при отрицательном x'}}
function calcAsk(){if(ct>=nC)return showResults("lesson('p','startP()')");ctask=genC(ct);mis=0;hnt=0;
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${(nQ+ct)/(nQ+nC)*100}%"></i></div><h2>Задача ${ct+1} из ${nC}</h2><p style="font-size:26px">${ctask.t}</p><p class="small">Дано → Найти → Решение → Ответ</p>
<div class="row"><span>Ответ: </span><input type="number" id="ans" inputmode="decimal"></div><div class="msg" id="m"></div>
<div class="row"><button class="ok" onclick="cCheck()">Проверить</button><button class="soft" onclick="cHint(1)">💡 Подсказка 1</button><button class="soft" onclick="cHint(2)">💡 Подсказка 2</button>${rb(ctask.t)}</div><div class="hint" id="hh" style="display:none"></div></div>`;say(ctask.t)}
function cHint(n){hnt++;const h=$('hh');h.style.display='block';h.innerHTML=n===1?'Формула: <b>'+ctask.f+'</b>':ctask.h;say(h.textContent)}
function cCheck(){const v=parseFloat($('ans').value.replace(',','.'));if(Math.abs(v-ctask.ans)<0.01){rec('Задача '+(ct+1)+': '+ctask.name,mis,hnt);$('m').innerHTML='<span class="good">'+rp()+' ⭐</span>';say('Верно!');beep(700);confetti();ct++;setTimeout(calcAsk,1300)}else{mis++;$('m').innerHTML='<span class="try">Пока не то. Открой подсказку и попробуй ещё раз.</span>';say('Попробуй ещё раз');beep(250);if(mis>=2)cHint(2)}}
function home(){const txt=STORY.join(' ');
app.innerHTML=`<div class="card"><div class="emoji">🌉📈</div><h2 style="text-align:center">Мастер арок</h2>${STORY.map(p=>'<p style="text-align:center;font-size:26px">'+p+'</p>').join('')}
<div class="row">${rb(txt)}</div><div class="row"><button class="big ok" onclick="lesson('p','startP()')">🌉 Начать!</button></div></div>`;say(txt)}

home();
</script></body></html>
